branding:
  color: orange
  icon: triangle
description: 'Cloudflare KV Action'
inputs:
  namespace_identifier:
    description: 'Cloudflare namespace id'
    required: true
  key_name:
    description: 'Cloudflare KV key name'
    required: true
  expiration:
    description: 'Cloudflare KV key expiration date'
    required: false
  expiration_ttl:
    description: 'Cloudflare KV key expiration time'
    required: false
  value:
    description: 'Cloudflare KV value'
    required: false
  operation:
    description:
      'One of get, put, delete. Default: put if value is not empty, else get.
      The value input is ignored for get and delete. The expiration inputs are
      ignored for get and delete.'
    required: false
  fail_on_missing:
    description:
      'Fail the step when a get finds no key. Set to false for an empty output.
      Other errors, including an unknown namespace, always fail.'
    required: false
    default: 'true'

name: Cloudflare KV Action
outputs:
  value:
    description: 'Value from KV store'
runs:
  main: dist/index.js
  using: node24
